[package]
name = "lyrnova"
version = "0.1.0"
description = "Ambiente desktop comunitário de desenvolvimento assistido por agente"
authors = ["Rodrigo Brito"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "lyrnova_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lyrnova"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
libc = "=0.2.189"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
semver = { version = "=1.0.28", features = ["serde"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
sha2 = "=0.10.9"
tar = "=0.4.46"
url = "=2.5.8"
uuid = { version = "=1.24.1", features = ["v4"] }
zstd = "=0.13.3"

[dev-dependencies]
serde_json = "=1.0.151"
